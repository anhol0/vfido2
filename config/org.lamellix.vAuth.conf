<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="vauth">
    <allow own="org.lamellix.vAuth"/>
  </policy>
  <policy user="root">
    <allow own="org.lamellix.vAuth"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.lamellix.vAuth"
           send_interface="org.lamellix.vAuth.UserInteraction1"
           send_member="RegisterAgent"/>
    <allow send_destination="org.lamellix.vAuth"
           send_interface="org.lamellix.vAuth.UserInteraction1"
           send_member="UnregisterAgent"/>
    <allow send_destination="org.lamellix.vAuth"
           send_interface="org.lamellix.vAuth.UserInteraction1"
           send_member="RespondToPresence"/>
    <allow send_destination="org.lamellix.vAuth"
           send_interface="org.lamellix.vAuth.UserInteraction1"
           send_member="CancelInteraction"/>
    <allow receive_sender="org.lamellix.vAuth"
           receive_interface="org.lamellix.vAuth.UserInteraction1"/>
  </policy>
</busconfig>
